name: Private firmware release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WATCHLING_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a private repository and a version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          [[ "$WATCHLING_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          echo "WATCHLING_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - name: Build offline installer
        working-directory: web-installer
        run: npm ci && npm test && npm run build
      - name: Test firmware packaging
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: echoear-firmware
          extra_docker_args: -e WATCHLING_VERSION -e WATCHLING_COMMIT
          command: >-
            python -m pip install idf-component-manager==2.5.2 &&
            idf.py -DPROJECT_VER=$WATCHLING_VERSION build &&
            python ../scripts/package-firmware-release.py
            --build-dir build --web-dir ../web-installer/dist
            --output-dir ../release-output --source-root .. --idf-path "$IDF_PATH"
            --version "$WATCHLING_VERSION" --commit "$WATCHLING_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: private-firmware
          path: |
            release-output/*.zip
            release-output/*.sha256
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WATCHLING_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: private-firmware
          path: release-output
      - name: Attach verified artifacts to a private draft release
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          cd release-output
          sha256sum -c ./*.sha256
          cd ..
          if gh release view "$WATCHLING_VERSION" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("/tmp/release-state.json"))["isDraft"])')" = True
          else
            gh release create "$WATCHLING_VERSION" --verify-tag --draft \
              --title "Watchling $WATCHLING_VERSION · ESP-VoCat V1.2" \
              --notes-file docs/firmware-release-notes.txt
          fi
          gh release upload "$WATCHLING_VERSION" release-output/*.zip release-output/*.sha256 --clobber
