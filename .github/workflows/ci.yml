name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge (macOS, Node 22)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: pc-bridge/.nvmrc
          cache: npm
          cache-dependency-path: pc-bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    name: Firmware (ESP32-S3, ESP-IDF 5.5)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: echoear-firmware
          # Handle LVGL's conditional dependencies before a clean build has Kconfig values.
          command: python -m pip install 'idf-component-manager==2.5.2' && idf.py build

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-secrets.py --history
      - run: bash -n scripts/idf-env.sh scripts/build-firmware-release.sh
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  installer:
    name: Offline web installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
